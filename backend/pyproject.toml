[project]
name = "code-council-backend"
version = "0.1.0"
description = "Parliamentary change monitor for Singapore law firms - backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "apscheduler>=3.10",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-frontmatter>=1.1",
    "rank-bm25>=0.2.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
